services:
  # Staging stack — same pattern as docker-compose.yml: values come from Compose
  # variable interpolation (project-root .env is loaded automatically). You can
  # also run: docker compose --env-file .env.staging -f docker-compose.staging.yml up
  finance-tracker-staging:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: finance-tracker-staging
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: staging
      PORT: ${PORT:-8000}
      DB_NAME: ${DB_NAME:-finance-tracker-dev}
      CONNECTION_STRING: ${CONNECTION_STRING}
      SECRET_KEY: ${SECRET_KEY}
      ENC_ALGO: ${ENC_ALGO:-HS256}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - .env.staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000/healthz', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - finance-tracker-network

networks:
  finance-tracker-network:
    driver: bridge
